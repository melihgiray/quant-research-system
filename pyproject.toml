[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research-system"
version = "0.28.0"
description = "Research framework for systematic equity and single-stock options strategies, with walk-forward validation and realistic transaction costs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "yfinance>=0.2",
    "pyarrow>=14",
    "requests>=2.28",
]

[project.optional-dependencies]
regime = ["hmmlearn>=0.3"]
ml = ["shap>=0.43"]
garch = ["arch>=6"]
monitor = ["anthropic>=0.100", "twilio>=8"]
fred = ["pandas-datareader>=0.10"]
dev = ["pytest>=7"]

[project.scripts]
quant-system = "quant_system.cli:main"

[tool.setuptools.packages.find]
include = ["quant_system*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore"]
