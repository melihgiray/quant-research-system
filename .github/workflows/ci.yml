# Runs the test suite on every push and pull request. This runs the pure test
# suite only: the docs/results scripts pull real prices from yfinance and are
# deliberately not run in CI, so the pipeline never depends on the network or on
# a data vendor being up.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,regime,ml,garch]"

      - name: Run tests
        run: pytest -q
